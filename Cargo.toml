[package]
name = "terrarium"
version = "0.1.0"
edition = "2021"
description = "A from-scratch scripting sandbox that runs untrusted code under fuel, memory, depth, and capability limits."
authors = ["Pavan Nallamothu <pavankumarpre@gmail.com>"]
license = "MIT"
repository = "https://github.com/pavanchow/terrarium"

[[bin]]
name = "terrarium"
path = "src/main.rs"

[lib]
name = "terrarium"
path = "src/lib.rs"

[profile.release]
panic = "unwind"
